{% extends "base.html" %}
{% block title %}404 Not Found — ReviewGuard AI{% endblock %}
{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1 class="error-code">404</h1>
        <h2>Page Not Found</h2>

    </div>
</div>
{% endblock %}
