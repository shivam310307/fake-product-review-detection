{% extends "base.html" %}
{% block title %}403 Forbidden — ReviewGuard AI{% endblock %}
{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1 class="error-code">403</h1>
        <h2>Access Forbidden</h2>
        <p class="error-desc">You do not have administrative authorization to access this restricted endpoint.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
