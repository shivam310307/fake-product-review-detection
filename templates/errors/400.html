{% extends "base.html" %}
{% block title %}400 Bad Request — ReviewGuard AI{% endblock %}
{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1 class="error-code">400</h1>
        <h2>Bad Request</h2>
        <p class="error-desc">{{ error or 'The server could not understand the request due to invalid parameters.' }}</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
